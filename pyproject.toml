[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "personal-news-agent"
version = "0.1.0"
description = "A production-oriented, DeepSeek-powered personal intelligent news agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Personal News Agent Contributors" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "loguru>=0.7,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "redis>=5.0,<6.0",
  "httpx>=0.27,<1.0",
  "apscheduler>=3.10,<4.0",
  "feedparser>=6.0,<7.0",
  "beautifulsoup4>=4.12,<5.0",
  "openai>=1.40,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<6.0",
  "aiosqlite>=0.20,<1.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "types-redis>=4.6,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
